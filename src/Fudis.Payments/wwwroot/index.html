<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fudis · Demo de confirmación de pagos</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f9; --panel: #ffffff; --ink: #1d1a29; --muted: #6b6680; --line: #e6e3ef;
    --brand: #6d28d9; --brand-soft: #efe7ff; --ok: #0f8a4b; --ok-soft: #e3f6ec;
    --bad: #c42b2b; --bad-soft: #fde8e8; --warn: #a15c00; --warn-soft: #fff1dc;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header h1 span { color: var(--brand); }
  header .sp { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; }
  button:hover { border-color: var(--brand); }
  button:disabled { opacity: .5; cursor: wait; }
  .btn-orig { border-color: #f0c2c2; color: var(--bad); }
  .btn-sol { background: var(--brand); border-color: var(--brand); color: #fff; }
  .switch { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); }
  .switch.down { background: var(--bad-soft); color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; padding: 10px 16px; } header .sp { display: none; } header h1 { width: 100%; }
    main { padding: 12px 16px; } main .results { grid-template-columns: 1fr; }
    .tip:hover::after { left: auto; right: 0; top: 22px; width: 240px; }
  }
  .panel .scroll { overflow-x: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card p { margin: 0 0 10px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .why { margin-left: auto; font-size: 12px; color: var(--brand); background: var(--brand-soft); border: 0; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .res { border-radius: 8px; padding: 8px 10px; font-size: 13px; border: 1px solid var(--line); }
  .res h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .res.pass { background: var(--ok-soft); border-color: #bfe6cf; }
  .res.fail { background: var(--bad-soft); border-color: #f3c6c6; }
  .res ul { margin: 0; padding-left: 16px; }
  .res li { margin: 2px 0; }
  .res .http { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tip { position: relative; display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center;
         background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 700; cursor: help; }
  .tip:hover::after { content: attr(data-tip); position: absolute; left: 24px; top: -6px; width: 280px; padding: 8px 10px; border-radius: 8px;
         background: #1d1a29; color: #fff; font-weight: 400; font-size: 12px; line-height: 1.4; z-index: 10; white-space: normal; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.mono { font-family: var(--mono); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-info { background: var(--brand-soft); color: var(--brand); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 1300px) { .grid2 { grid-template-columns: 1fr; } }
  .scroll { max-height: 260px; overflow: auto; }
  .empty { color: var(--muted); font-style: italic; padding: 6px; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: #fff3b0; } to { background: transparent; } }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast { background: #1d1a29; color: #fff; padding: 10px 14px; border-radius: 10px; max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  dialog { border: 0; border-radius: 14px; padding: 0; max-width: 620px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(20, 16, 35, .45); }
  dialog .body { padding: 20px 22px; }
  dialog h3 { margin-top: 0; }
  dialog .say { background: var(--brand-soft); border-left: 3px solid var(--brand); padding: 10px 12px; border-radius: 6px; margin-top: 12px; }
  dialog code { font-family: var(--mono); background: #f2f0f7; padding: 1px 4px; border-radius: 4px; }
  dialog footer { padding: 12px 22px; border-top: 1px solid var(--line); text-align: right; }
  .intro ol { margin: 6px 0 12px; padding-left: 20px; color: var(--ink); }
  .intro li { margin: 3px 0; }
  .score { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .pill.orig { background: var(--bad-soft); color: var(--bad); }
  .pill.sol { background: var(--ok-soft); color: var(--ok); }
  .group { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }
  .verdict { font-weight: 700; margin: 2px 0 6px; font-size: 13.5px; }
  .res.wait { background: var(--warn-soft); border-color: #f1d29c; }
  .flow { display: flex; gap: 6px; flex-wrap: wrap; }
  .step { flex: 1 1 130px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #faf9fc; transition: background .3s; }
  .step b { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .step small { display: block; color: var(--muted); font-size: 11.5px; }
  .step .count { margin-top: 4px; font-size: 12px; }
  .step.passed { background: var(--ok-soft); border-color: #bfe6cf; }
  .step.stopped { background: var(--warn-soft); border-color: #f1d29c; }
  .step.blocked { background: var(--bad-soft); border-color: #f3c6c6; }
  .step.idle { opacity: .55; }
  .flow-note { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1><span>Fudis</span> · <span data-i18n="title" style="color:inherit">Demo de confirmación de pagos</span></h1>
  <div class="sp"></div>
  <label class="switch" style="background:var(--brand-soft);color:var(--brand)">
    <input type="checkbox" id="latency" checked> <span data-i18n="latency">Latencia realista (30 ms)</span>
    <span class="tip" data-i18n-tip="latencyTip">?</span>
  </label>
  <label class="switch" id="restSwitch">
    <input type="checkbox" id="restDown"> <span id="restLabel">Restaurante en línea</span>
    <span class="tip" data-i18n-tip="restTip">?</span>
  </label>
  <button id="lang" title="Idioma / Language">ES · <b>EN</b></button>
  <button id="reset" data-i18n="reset">Limpiar datos</button>
</header>

<main>
  <section>
    <div class="card intro">
      <h3 data-i18n="howTitle">Cómo usar esta demo</h3>
      <ol data-i18n="howSteps"></ol>
      <div class="actions">
        <button class="btn-sol" id="runAll" data-i18n="runAll">▶ Ejecutar los 10 escenarios</button>
        <div class="score" id="score"></div>
      </div>
    </div>
    <div id="scenarios"></div>
  </section>

  <section>
    <div class="card panel">
      <h2><span data-i18n="flowTitle">Cómo procesa la solución un aviso</span> <span class="tip" data-i18n-tip="flowTip">?</span></h2>
      <div class="flow" id="flow"></div>
      <div class="flow-note" id="flowNote"></div>
    </div>
    <div class="card panel">
      <h2><span data-i18n="ordersTitle">Pedidos</span> <span class="tip" data-i18n-tip="ordersTip">?</span></h2>
      <div class="scroll"><table id="tOrders"></table></div>
    </div>
    <div class="grid2">
      <div class="card panel">
        <h2><span data-i18n="earnTitle">Ganancias · solución</span> <span class="tip" data-i18n-tip="earnTip">?</span></h2>
        <div class="scroll"><table id="tEarnings"></table></div>
      </div>
      <div class="card panel">
        <h2><span data-i18n="legacyTitle">Ganancias · código original</span> <span class="tip" data-i18n-tip="legacyTip">?</span></h2>
        <div class="scroll"><table id="tLegacy"></table></div>
      </div>
    </div>
    <div class="card panel">
      <h2><span data-i18n="notifTitle">Notificaciones de la pasarela</span> <span class="tip" data-i18n-tip="notifTip">?</span></h2>
      <div class="scroll"><table id="tNotifs"></table></div>
    </div>
    <div class="grid2">
      <div class="card panel">
        <h2><span data-i18n="outboxTitle">Outbox</span> <span class="tip" data-i18n-tip="outboxTip">?</span></h2>
        <div class="scroll"><table id="tOutbox"></table></div>
      </div>
      <div class="card panel">
        <h2><span data-i18n="restRecTitle">Restaurante: avisos recibidos</span> <span class="tip" data-i18n-tip="restRecTip">?</span></h2>
        <div class="scroll"><table id="tRest"></table></div>
      </div>
    </div>
  </section>
</main>

<div id="toasts"></div>
<dialog id="why"><div class="body" id="whyBody"></div><footer><button onclick="why.close()" data-i18n="gotIt">Entendido</button></footer></dialog>

<script>
const $ = (s) => document.querySelector(s);
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => `S/ ${Number(n).toFixed(2)}`;
const toast = (msg) => {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = msg; $('#toasts').append(el);
  setTimeout(() => el.remove(), 5000);
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// --------------------------------------------------------------- idioma (inglés por defecto)
let LANG = new URLSearchParams(location.search).get('lang')
  || (() => { try { return localStorage.getItem('lang'); } catch { return null; } })() || 'en';
if (!['es', 'en'].includes(LANG)) LANG = 'en';
const T = (es, en) => (LANG === 'en' ? en : es);
const sv = (s, k) => (LANG === 'en' && s.en && s.en[k] !== undefined ? s.en[k] : s[k]);
const I18N = {
  title: ['Demo de confirmación de pagos', 'Payment confirmation demo'],
  latency: ['Latencia realista (30 ms)', 'Realistic latency (30 ms)'],
  latencyTip: ['Agrega 30 ms entre que el código ORIGINAL lee el pedido y lo guarda, como la latencia de una base de datos remota en producción. La carrera existe igual sin esto, pero depende de la suerte; con latencia se reproduce siempre. La solución no depende del tiempo: la protegen la base de datos y sus índices únicos.',
    'Adds 30 ms between the moment the ORIGINAL code reads the order and saves it, like the latency of a remote production database. The race exists without it, but then it depends on luck; with latency it reproduces every time. The fix does not depend on timing: the database and its unique indexes protect it.'],
  restTip: ['Simula que el servicio que avisa al restaurante se cae. Con la solución, el aviso queda en el outbox y se reintenta solo; con el original, el aviso se pierde.',
    'Simulates the restaurant notification service going down. With the fix, the notice stays in the outbox and is retried automatically; with the original, it is lost.'],
  reset: ['Limpiar datos', 'Reset data'],
  howTitle: ['Cómo usar esta demo', 'How to use this demo'],
  howSteps: ['<li>En cada escenario presiona <b>▶ Código original</b> y después <b>▶ Solución</b>.</li><li>Compara: <b style="color:var(--bad)">rojo</b> = el negocio pierde dinero o información; <b style="color:var(--ok)">verde</b> = correcto.</li><li>Abre <b>¿Por qué?</b> para ver la explicación.</li>',
    '<li>In each scenario, click <b>▶ Original code</b> and then <b>▶ Fix</b>.</li><li>Compare: <b style="color:var(--bad)">red</b> = the business loses money or information; <b style="color:var(--ok)">green</b> = correct.</li><li>Open <b>Why?</b> for the explanation.</li>'],
  runAll: ['▶ Ejecutar los 10 escenarios', '▶ Run all 10 scenarios'],
  flowTitle: ['Cómo procesa la solución un aviso', 'How the fix processes a notification'],
  flowTip: ['Cada aviso de la pasarela pasa por estas capas en orden. Al ejecutar un escenario con la solución se ve en cuál se frenó cada aviso.',
    'Every gateway notification goes through these layers in order. Run a scenario with the fix to see where each notification was stopped.'],
  flowNote: ['Ejecuta un escenario con la <b>solución</b> para ver en qué capa se frena cada aviso.', 'Run a scenario with the <b>fix</b> to see which layer stops each notification.'],
  ordersTitle: ['Pedidos', 'Orders'],
  ordersTip: ['Cada escenario crea un pedido nuevo. El estado solo debe pasar de PENDING_PAYMENT a PAID una vez y con el importe correcto.', 'Each scenario creates a new order. Its status must go from PENDING_PAYMENT to PAID only once, and only with the right amount.'],
  earnTitle: ['Ganancias · solución', 'Driver earnings · fix'],
  earnTip: ['Índice único por pedido en la base: aunque la lógica fallara, SQL Server rechaza una segunda ganancia para el mismo pedido.', 'Unique index per order in the database: even if the logic failed, SQL Server rejects a second earning for the same order.'],
  legacyTitle: ['Ganancias · código original', 'Driver earnings · original code'],
  legacyTip: ['Tabla aparte, sin índice único, donde escribe el código original tal cual. Aquí se ven los pagos duplicados al repartidor.', 'A separate table without a unique index, written by the original code as is. Duplicate payments to the driver show up here.'],
  notifTitle: ['Notificaciones de la pasarela', 'Gateway notifications'],
  notifTip: ['Cada aviso que llega se registra. El índice único por EventId hace que una notificación repetida no tenga efecto.', 'Every incoming notification is recorded. The unique index on EventId makes a repeated notification have no effect.'],
  outboxTitle: ['Outbox', 'Outbox'],
  outboxTip: ['Efectos externos guardados en la misma transacción que el pago. Un proceso los envía cada 2 s y, si fallan, reintenta con espera exponencial (2, 4, 8… s).', 'External effects saved in the same transaction as the payment. A worker sends them every 2 s and retries failures with exponential backoff (2, 4, 8… s).'],
  restRecTitle: ['Restaurante: avisos recibidos', 'Restaurant: notices received'],
  restRecTip: ['Lo que realmente le llegó al restaurante simulado.', 'What actually reached the simulated restaurant.'],
  gotIt: ['Entendido', 'Got it'],
};
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = T('Fudis · Demo de confirmación de pagos', 'Fudis · Payment confirmation demo');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = T(...I18N[el.dataset.i18n]); });
  document.querySelectorAll('[data-i18n-tip]').forEach((el) => { el.dataset.tip = T(...I18N[el.dataset.i18nTip]); });
  $('#lang').innerHTML = LANG === 'en' ? 'ES · <b>EN</b>' : '<b>ES</b> · EN';
  if (!lastSolution) $('#flowNote').innerHTML = T(...I18N.flowNote);
}

// --------------------------------------------------------------- escenarios
// expect: lo que el negocio necesita que pase. Se evalúa igual para el original y la solución.
const SCENARIOS = [
  {
    group: 'Caso feliz', id: 'normal', title: '1. Pago normal',
    desc: 'La pasarela avisa una vez que el cliente pagó.',
    tip: 'El caso feliz: ambas versiones funcionan. Por eso el original "pasó las pruebas funcionales".',
    order: {}, steps: [{}],
    expect: { status: 'PAID', earnings: 1, notified: 1 },
    why: `<p>Las dos versiones marcan el pedido como pagado, registran la ganancia y avisan al restaurante.</p>
          <p>Este es el único escenario que las pruebas funcionales cubrían. El resto de la demo muestra lo que pasa en producción.</p>`,
    say: 'El código original funciona en el caso feliz; los problemas aparecen con reintentos, concurrencia, fallos y datos no confiables.',
    en: {"group": "Happy path", "title": "1. Normal payment", "desc": "The gateway notifies once that the customer paid.", "tip": "The happy path: both versions work. That is why the original \"passed the functional tests\".", "why": "<p>Both versions mark the order as paid, record the driver's earning and notify the restaurant.</p><p>This is the only scenario the functional tests covered. The rest of the demo shows what happens in production.</p>", "say": "The original code works on the happy path; the problems show up with retries, concurrency, failures and untrusted data."},
  },
  {
    group: 'Avisos repetidos y concurrencia', id: 'repeat', title: '2. La pasarela reenvía el mismo aviso',
    desc: 'Dos avisos idénticos, uno detrás del otro (reintento normal de cualquier pasarela).',
    tip: 'Idempotencia: el índice único por EventId en PaymentNotifications.',
    order: {}, steps: [{ eventId: 'fixed' }, { eventId: 'fixed' }],
    expect: { status: 'PAID', earnings: 1, notified: 1 },
    why: `<p>La primera notificación paga el pedido. La segunda intenta insertar el mismo <code>EventId</code> en <code>PaymentNotifications</code>, choca con el índice único y responde <b>200 Duplicate</b> sin tocar nada.</p>
          <p>Uno detrás del otro, el original también aguanta, porque ve <code>PAID</code> y sale. El problema viene en el siguiente escenario.</p>`,
    say: 'La idempotencia la garantiza la base de datos, no un if: el índice único por EventId.',
    en: {"group": "Repeated notifications and concurrency", "title": "2. The gateway resends the same notification", "desc": "Two identical notifications, one after the other (a normal retry from any gateway).", "tip": "Idempotency: the unique index on EventId in PaymentNotifications.", "why": "<p>The first notification pays the order. The second tries to insert the same <code>EventId</code> into <code>PaymentNotifications</code>, hits the unique index and returns <b>200 Duplicate</b> without touching anything.</p><p>One after the other, the original also holds, because it sees <code>PAID</code> and returns. The problem comes in the next scenario.</p>", "say": "Idempotency is guaranteed by the database, not by an if: the unique index on EventId."},
  },
  {
    id: 'race', title: '3. 20 avisos iguales al mismo tiempo',
    desc: 'La pasarela dispara el mismo aviso 20 veces en paralelo (timeouts y reintentos).',
    tip: 'Concurrencia: el original lee, decide y escribe sin bloqueo (check-then-act). Varias peticiones ven el pedido sin pagar.',
    order: {}, steps: [{ copies: 20, eventId: 'fixed' }],
    expect: { status: 'PAID', earnings: 1, notified: 1 },
    why: `<p><b>Original:</b> las 20 peticiones hacen <code>FindAsync</code> casi a la vez. Varias leen el pedido como no pagado antes de que la primera guarde, y cada una crea una ganancia. <b>Fudis le paga varias veces al repartidor.</b></p>
          <p><b>Solución:</b> el INSERT con el mismo <code>EventId</code> se bloquea hasta que la primera transacción termina y después falla por clave duplicada. Una sola gana.</p>`,
    say: 'Un if de estado no protege contra concurrencia. Lo que protege es una operación atómica en la base: índice único más UPDATE condicional.',
    en: {"title": "3. 20 identical notifications at the same time", "desc": "The gateway fires the same notification 20 times in parallel (timeouts and retries).", "tip": "Concurrency: the original reads, decides and writes without any lock (check-then-act). Several requests see the order as unpaid.", "why": "<p><b>Original:</b> the 20 requests call <code>FindAsync</code> almost at once. Several read the order as unpaid before the first one saves, and each creates an earning. <b>The driver gets paid several times.</b></p><p><b>Fix:</b> the INSERT with the same <code>EventId</code> waits until the first transaction finishes and then fails with a duplicate key. Only one wins.</p>", "say": "An if on the status does not protect against concurrency. An atomic operation in the database does: a unique index plus a conditional UPDATE."},
  },
  {
    id: 'retries', title: '4. Reintentos con EventId distinto',
    desc: '10 avisos en paralelo del mismo cobro, pero la pasarela regenera el EventId en cada reintento.',
    tip: 'El índice por EventId no alcanza; lo frena el UPDATE condicional: WHERE Status = PENDING_PAYMENT.',
    order: {}, steps: [{ copies: 10, sameEventId: false }],
    expect: { status: 'PAID', earnings: 1, notified: 1, alerts: 0 },
    why: `<p>Como cada aviso tiene un <code>EventId</code> distinto, todos pasan el filtro de idempotencia. Pero la transición es un <code>UPDATE … WHERE Status = 'PENDING_PAYMENT'</code>.</p>
          <p>SQL Server bloquea la fila: la primera gana, y las demás esperan, vuelven a evaluar la condición y ya no encuentran el pedido pendiente (<b>AlreadyPaid</b>). Son el mismo <code>PaymentId</code>, así que no hay alerta.</p>`,
    say: 'Hay dos capas: idempotencia por evento y una transición de estado atómica. Y una tercera en la base: índice único de ganancia por pedido.',
    en: {"title": "4. Retries with a different EventId", "desc": "10 parallel notifications for the same charge, but the gateway generates a new EventId on each retry.", "tip": "The EventId index is not enough here; the conditional UPDATE stops it: WHERE Status = PENDING_PAYMENT.", "why": "<p>Since each notification has a different <code>EventId</code>, they all pass the idempotency filter. But the transition is an <code>UPDATE … WHERE Status = 'PENDING_PAYMENT'</code>.</p><p>SQL Server locks the row: the first one wins, and the others wait, re-evaluate the condition and no longer find a pending order (<b>AlreadyPaid</b>). Same <code>PaymentId</code>, so no alert.</p>", "say": "Two layers: idempotency per event and an atomic state transition. Plus a third one in the database: a unique earning per order."},
  },
  {
    group: 'Dinero del cliente', id: 'double', title: '5. Doble cobro al cliente',
    desc: 'Llega un segundo cobro distinto (otro PaymentId) para un pedido que ya está pagado.',

const ORDER = ['normal', 'repeat', 'race', 'retries', 'double', 'amount', 'forged', 'cancel', 'nodriver', 'down'];
SCENARIOS.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

const runs = {}; // scenarioId -> { original: run, solution: run }

function renderScenarios() {
  $('#scenarios').innerHTML = SCENARIOS.map((s) => `${s.group ? `<div class="group">${sv(s, 'group')}</div>` : ''}
    <div class="card" id="sc-${s.id}">
      <h3>${sv(s, 'title')} <span class="tip" data-tip="${esc(sv(s, 'tip'))}">?</span>
        <button class="why" data-why="${s.id}">${T('¿Por qué?', 'Why?')}</button></h3>
      <p>${sv(s, 'desc')}</p>
      <div class="actions">
        <button class="btn-orig" data-run="${s.id}" data-mode="original">${T('▶ Código original', '▶ Original code')}</button>
        <button class="btn-sol" data-run="${s.id}" data-mode="solution">${T('▶ Solución', '▶ Fix')}</button>
      </div>
      <div class="results" id="res-${s.id}"></div>
    </div>`).join('');
}

async function runScenario(id, mode, btn) {
  const s = SCENARIOS.find((x) => x.id === id);
  document.querySelectorAll(`#sc-${id} button[data-run]`).forEach((b) => (b.disabled = true));
  try {
    const order = await api('/demo/orders', { deliveryFee: 10, total: 50, driverId: 7, status: 'PENDING_PAYMENT', ...s.order });
    const fixedEvent = `evt_${id}_${order.id}`;
    const responses = [];
    for (const step of s.steps) {
      if (step.restaurantDown) await setRestaurant(true);
      const res = await api('/demo/send', {
        orderId: order.id, mode,
        copies: step.copies ?? 1,
        sameEventId: step.sameEventId ?? true,
        eventId: step.eventId ? fixedEvent : null,
        paymentId: step.paymentId ?? 'pay_1',
        amount: step.amount ?? null,
        validSignature: step.validSignature ?? true,
        latencyMs: $('#latency').checked ? 30 : 0,
      });
      responses.push(...res);
      await sleep(150);
    }
    runs[id] = { ...(runs[id] || {}), [mode]: { orderId: order.id, responses } };
    if (mode === 'solution') lastSolution = { id: s.id, orderId: order.id, responses };
    toast(`<b>${sv(s, 'title')}</b> · ${mode === 'original' ? T('código original', 'original code') : T('solución', 'fix')}: ${summarizeHttp(responses)}`);
    await refresh();
  } catch (e) {
    toast(`Error: ${esc(e.message)}`);
  } finally {
    document.querySelectorAll(`#sc-${id} button[data-run]`).forEach((b) => (b.disabled = false));
  }
}

function summarizeHttp(responses) {
  const groups = {};
  for (const r of responses) {
    let label = String(r.status);
    try { const b = JSON.parse(r.body || '{}'); if (b.result) label += ` ${b.result}`; } catch {}
    groups[label] = (groups[label] || 0) + 1;
  }
  return `${responses.length} ${T('envío(s)', 'request(s)')} → ` + Object.entries(groups).map(([k, v]) => `${k}${v > 1 ? ` ×${v}` : ''}`).join(', ');
}

function evaluate(s, mode, run, st) {
  const order = st.orders.find((o) => o.id === run.orderId);
  const earnings = mode === 'original'
    ? st.legacyEarnings.filter((e) => e.orderId === run.orderId)
    : st.earnings.filter((e) => e.orderId === run.orderId);
  const notified = st.restaurantReceived.filter((n) => n.orderId === run.orderId && n.source === (mode === 'original' ? 'original' : 'solución')).length;
  const alerts = mode === 'original' ? 0 : st.outbox.filter((m) => m.type === 'PaymentReviewRequested' && JSON.parse(m.payload).orderId === run.orderId).length;
  const pendingRestaurant = mode === 'solution' && st.outbox.some((m) => m.type === 'RestaurantPaymentConfirmed' && JSON.parse(m.payload).orderId === run.orderId && !m.processedAt);
  const total = earnings.reduce((a, e) => a + Number(e.amount), 0);

  const checks = [];
  const ex = s.expect;
  if (ex.status) checks.push([order?.status === ex.status, `${T('Pedido', 'Order')} #${run.orderId}: <b>${order?.status ?? '—'}</b>${order?.status === ex.status ? '' : ` (${T('debería ser', 'should be')} ${ex.status})`}`]);
  if (ex.earnings !== undefined) {
    const ok = earnings.length === ex.earnings;
    checks.push([ok, `${T('Ganancias del repartidor', 'Driver earnings')}: <b>${earnings.length}</b>${earnings.length ? ` (${money(total)})` : ''}${ok ? '' : ` — ${earnings.length > ex.earnings ? T('se pagó de más ❗', 'overpaid ❗') : `${T('deberían ser', 'should be')} ${ex.earnings}`}`}`]);
  }
  if (ex.pendingAssignment) {
    const e = earnings[0];
    const ok = mode === 'solution' && e?.status === 'PENDING_ASSIGNMENT';
    checks.push([ok, ok ? T('Ganancia <b>PENDING_ASSIGNMENT</b> (sin repartidor)', 'Earning <b>PENDING_ASSIGNMENT</b> (no driver yet)') : T('Ganancia sin dueño (DriverId nulo, sin estado)', 'Earning with no owner (null DriverId, no status)')]);
  }
  if (ex.notified !== undefined) {
    const ok = notified === ex.notified;
    const extra = !ok && pendingRestaurant ? T(' — pendiente en outbox, reintentando ⏳', ' — pending in the outbox, retrying ⏳')
      : !ok && notified === 0 ? T(' — el aviso se perdió', ' — the notice was lost') : !ok ? T(' — avisado de más', ' — notified too many times') : '';
    checks.push([ok, `${T('Avisos al restaurante', 'Restaurant notices')}: <b>${notified}</b>${extra}`, 'notified']);
  }
  if (ex.alerts !== undefined) {
    const ok = alerts === ex.alerts;
    checks.push([ok, ex.alerts ? `${T('Alerta para operaciones', 'Alert to operations')}: <b>${alerts ? T('sí', 'yes') : 'no'}</b>${ok ? '' : T(' — nadie se entera', ' — nobody finds out')}` : `${T('Alertas falsas', 'False alerts')}: <b>${alerts}</b>`]);
  }
  return { checks, m: { order, earnings, total, notified, alerts, pendingRestaurant } };
}

function verdict(s, mode, checks, m) {
  const ex = s.expect;
  if (checks.every(([ok]) => ok)) return ['pass', T('✔ El negocio queda protegido', '✔ The business is protected')];
  const onlyWaiting = checks.every(([ok, , kind]) => ok || kind === 'notified') && m.pendingRestaurant;
  if (onlyWaiting) return ['wait', T('⏳ Pago guardado; el aviso se reintenta solo. Pon el restaurante en línea.', '⏳ Payment saved; the notice retries on its own. Turn the restaurant back online.')];
  if (ex.status && m.order && m.order.status !== ex.status)
    return ['fail', ex.status === 'PENDING_PAYMENT' ? T('❗ El pedido quedó PAGADO sin un pago válido', '❗ The order was marked PAID without a valid payment')
                  : ex.status === 'CANCELLED' ? T('❗ Un pedido cancelado quedó PAGADO y generó ganancia', '❗ A cancelled order was marked PAID and paid the driver')
                  : `❗ ${T('El pedido quedó', 'The order ended up')} ${m.order.status}`];
  if (ex.earnings !== undefined && m.earnings.length > ex.earnings)
    return ['fail', T(`❗ Al repartidor se le pagó ${m.earnings.length} veces: ${money(m.total)} por un envío de ${money(m.order?.deliveryFee ?? 0)}`,
                      `❗ The driver was paid ${m.earnings.length} times: ${money(m.total)} for a ${money(m.order?.deliveryFee ?? 0)} delivery`)];
  if (ex.pendingAssignment) return ['fail', T('❗ Ganancia registrada sin repartidor ni estado', '❗ Earning recorded with no driver and no status')];
  if (ex.notified !== undefined && m.notified === 0) return ['fail', T('❗ El restaurante nunca se enteró del pedido', '❗ The restaurant never found out about the order')];
  if (ex.notified !== undefined && m.notified > ex.notified) return ['fail', T(`❗ El restaurante recibió el aviso ${m.notified} veces`, `❗ The restaurant was notified ${m.notified} times`)];
  if (ex.alerts && !m.alerts) return ['fail', T('❗ Nadie se entera del problema', '❗ Nobody finds out about the problem')];
  return ['fail', T('❗ Comportamiento incorrecto', '❗ Wrong behavior')];
}

function renderResults(st) {
  const score = { original: { ok: 0, total: 0 }, solution: { ok: 0, total: 0 } };
  for (const s of SCENARIOS) {
    const box = $(`#res-${s.id}`);
    const r = runs[s.id];
    if (!r) { box.innerHTML = ''; continue; }
    box.innerHTML = ['original', 'solution'].map((mode) => {
      const run = r[mode];
      const label = mode === 'original' ? T('Código original', 'Original code') : T('Solución', 'Fix');
      if (!run) return `<div class="res"><h4>${label}</h4><span class="empty">${T('Sin ejecutar', 'Not run yet')}</span></div>`;
      const { checks, m } = evaluate(s, mode, run, st);
      const [cls, text] = verdict(s, mode, checks, m);
      score[mode].total++; if (cls === 'pass') score[mode].ok++;
      return `<div class="res ${cls}">
        <h4>${label} ${cls === 'pass' ? '✅' : cls === 'wait' ? '⏳' : '❌'}</h4>
        <div class="verdict">${text}</div>
        <ul>${checks.map(([ok, t]) => `<li>${ok ? '✔' : '✘'} ${t}</li>`).join('')}</ul>
        <div class="http">${esc(summarizeHttp(run.responses))}</div></div>`;
    }).join('');
  }
  $('#score').innerHTML = score.original.total + score.solution.total
    ? `<span class="pill orig">${T('Código original', 'Original code')}: ${score.original.ok}/${score.original.total} ${T('correctos', 'correct')}</span>
       <span class="pill sol">${T('Solución', 'Fix')}: ${score.solution.ok}/${score.solution.total} ${T('correctos', 'correct')}</span>`
    : '';
}

const badge = (text, kind) => `<span class="badge b-${kind}">${esc(text)}</span>`;
const statusKind = { PAID: 'ok', PENDING_PAYMENT: 'warn', CANCELLED: 'bad', APPLIED: 'ok', ALREADY_PAID: 'info',
  AMOUNT_MISMATCH: 'bad', ORDER_NOT_PAYABLE: 'bad', PAYABLE: 'ok', PENDING_ASSIGNMENT: 'warn' };
const ago = (iso, now) => { if (!iso) return ''; const s = Math.round((new Date(iso) - new Date(now)) / 1000); return s > 0 ? T(`en ${s}s`, `in ${s}s`) : T(`hace ${-s}s`, `${-s}s ago`); };
let seen = new Set();

function table(el, head, rows, empty) {
  const fresh = [];
  el.innerHTML = `<tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>` + (rows.length
    ? rows.map(([key, cells]) => { const isNew = !seen.has(key); if (isNew) fresh.push(key); return `<tr class="${isNew && seen.size ? 'flash' : ''}">${cells.map((c) => `<td>${c}</td>`).join('')}</tr>`; }).join('')
    : `<tr><td class="empty" colspan="${head.length}">${empty}</td></tr>`);
  fresh.forEach((k) => seen.add(k));
}

const STEPS = () => [
  { k: 'sig', t: T('1 · Firma', '1 · Signature'), d: T('¿Lo envió la pasarela?', 'Did the gateway send it?'), tip: T('HMAC-SHA256 del cuerpo exacto + timestamp de máx. 5 min. Si falla: 401 y no se toca la base.', 'HMAC-SHA256 of the exact body + a timestamp of max. 5 min. If it fails: 401, and the database is not touched.') },

  { k: 'state', t: T('3 · Transición atómica', '3 · Atomic transition'), d: T('PENDING → PAID con importe correcto', 'PENDING → PAID with the right amount'), tip: T('UPDATE … WHERE Status = PENDING_PAYMENT AND Total = importe. Si dos compiten, gana una sola.', 'UPDATE … WHERE Status = PENDING_PAYMENT AND Total = amount. If two compete, only one wins.') },
  { k: 'write', t: T('4 · Ganancia + outbox', '4 · Earning + outbox'), d: T('En la misma transacción', 'In the same transaction'), tip: T('Ganancia única por pedido (índice único) y aviso guardado junto con el pago.', 'One earning per order (unique index) and the notice saved with the payment.') },
  { k: 'send', t: T('5 · Aviso al restaurante', '5 · Restaurant notice'), d: T('Con reintentos', 'With retries'), tip: T('El outbox lo envía cada 2 s; si falla, reintenta con espera exponencial.', 'The outbox sends it every 2 s; on failure it retries with exponential backoff.') },
];
let lastSolution = null; // { scenario, orderId, responses }

function stageOf(r) {
  if (r.status === 401) return 0;
  let result = '';
  try { result = JSON.parse(r.body || '{}').result ?? ''; } catch {}
  if (result === 'Duplicate') return 1;
  if (result === 'Applied') return 3;
  return 2; // AlreadyPaid, AmountMismatch, OrderNotPayable, NotFound
}

function renderFlow(st) {
  const counts = [0, 0, 0, 0, 0];      // frenados en cada capa
  let delivered = 0, pending = false;
  if (lastSolution) {
    lastSolution.responses.forEach((r) => counts[stageOf(r)]++);
    delivered = st.restaurantReceived.filter((n) => n.orderId === lastSolution.orderId && n.source === 'solución').length;
    pending = st.outbox.some((m) => m.type === 'RestaurantPaymentConfirmed' && JSON.parse(m.payload).orderId === lastSolution.orderId && !m.processedAt);
  }
  const total = lastSolution?.responses.length ?? 0;
  let reached = total;
  $('#flow').innerHTML = STEPS().map((s, i) => {
    let cls = 'idle', line = '';
    if (lastSolution) {
      if (i < 4) {
        const stopped = i === 3 ? 0 : counts[i];
        const passed = reached - stopped;
        cls = reached === 0 ? 'idle' : stopped ? (i === 0 ? 'blocked' : 'stopped') : 'passed';
        line = reached === 0 ? '' : stopped ? `✋ ${stopped} ${T('frenado(s) aquí', 'stopped here')}${passed ? ` · ✔ ${passed} ${T('siguió', 'went on')}` : ''}` : `✔ ${reached} ${T('pasó', 'passed')}`;
        reached = i === 3 ? counts[3] : passed;
      } else if (counts[3]) {
        cls = delivered ? 'passed' : pending ? 'stopped' : 'idle';
        line = delivered ? `✔ ${T('entregado', 'delivered')} (${delivered})` : pending ? T('⏳ reintentando…', '⏳ retrying…') : '';
      }
    }
    return `<div class="step ${cls}"><b>${s.t} <span class="tip" data-tip="${esc(s.tip)}">?</span></b><small>${s.d}</small>${line ? `<div class="count">${line}</div>` : ''}</div>`;
  }).join('');
  if (lastSolution) {
    const where = [T('la firma', 'the signature'), T('la idempotencia', 'idempotency'), T('la transición atómica', 'the atomic transition')];
    const parts = [0, 1, 2].filter((i) => counts[i]).map((i) => `${counts[i]} ${T('en', 'at')} ${where[i]}`);
    const sc = SCENARIOS.find((x) => x.id === lastSolution.id);
    $('#flowNote').innerHTML = `<b>${esc(sv(sc, 'title'))}</b>: ${total} ${T('aviso(s)', 'notification(s)')} → ${counts[3]} ${T('aplicado(s)', 'applied')}${parts.length ? `, ${T('frenados', 'stopped')}: ${parts.join(', ')}` : ''}.`;
  }
}

async function refresh() {
  try {
    const st = await api('/demo/state');
    renderTables(st);
    renderResults(st);
    renderFlow(st);
    $('#restDown').checked = st.restaurantDown;
    $('#restSwitch').classList.toggle('down', st.restaurantDown);
    $('#restLabel').textContent = st.restaurantDown ? T('Restaurante caído', 'Restaurant down') : T('Restaurante en línea', 'Restaurant online');
  } catch (e) { /* servidor reiniciando */ }
}

async function setRestaurant(down) {
  await api('/demo/restaurant', { down });
  toast(down ? T('Restaurante <b>caído</b>: los avisos fallarán.', 'Restaurant <b>down</b>: notices will fail.') : T('Restaurante <b>en línea</b>: el outbox entregará lo pendiente.', 'Restaurant <b>online</b>: the outbox will deliver what is pending.'));
  await refresh();
}

// --------------------------------------------------------------- eventos
document.addEventListener('click', (e) => {
  const run = e.target.closest('[data-run]');
  if (run) return runScenario(run.dataset.run, run.dataset.mode, run);
  const w = e.target.closest('[data-why]');
  if (w) {
    const s = SCENARIOS.find((x) => x.id === w.dataset.why);
    $('#whyBody').innerHTML = `<h3>${sv(s, 'title')}</h3>${sv(s, 'why')}<div class="say"><b>${T('En una frase:', 'In one sentence:')}</b> ${sv(s, 'say')}</div>`;
    $('#why').showModal();
  }
});
$('#runAll').addEventListener('click', async (e) => {
  e.target.disabled = true;
  try {
    for (const s of SCENARIOS) {
      document.getElementById(`sc-${s.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      await runScenario(s.id, 'original');
      await runScenario(s.id, 'solution');
      if (s.id === 'down') { await sleep(4000); await setRestaurant(false); }
      await sleep(400);
    }
    toast(T('Listo: revisa el marcador arriba.', 'Done: check the score at the top.'));
  } finally { e.target.disabled = false; }
});
$('#restDown').addEventListener('change', (e) => setRestaurant(e.target.checked));
$('#reset').addEventListener('click', async () => {
  await api('/demo/reset', {});
  for (const k of Object.keys(runs)) delete runs[k];
  lastSolution = null;
  $('#flowNote').innerHTML = T(...I18N.flowNote);
  seen = new Set();
  toast(T('Datos limpios.', 'Data reset.'));
  await refresh();
});

$('#lang').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('lang', LANG); } catch {}
  applyStatic();
  renderScenarios();
  refresh();
});

applyStatic();
renderScenarios();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
